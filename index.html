<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Menu dropdown dọc</title>
  <style>
    * {
      margin: 0;
      padding: 0;
    }

    body {
      font-family: Arial, sans-serif;
    }

    #menu ul {
      list-style: none;
    }

    #menu li {
      position: relative;
      width: 100px;
      height: 30px;
      padding: 0 20px;
      background-color: black;
      line-height: 30px;
      cursor: pointer;
    }

    #menu a {
      display: block;
      color: white;
      text-decoration: none;
    }

    #menu li:hover,
    #menu li:focus-within {
      background-color: #444;
    }

    #menu li > ul {
      position: absolute;
      top: 0;
      left: 100%;
      visibility: hidden;
    }

    #menu li:hover > ul,
    #menu li:focus-within > ul {
      visibility: visible;
    }
  </style>
</head>
<body>
  <nav id="menu" aria-label="Menu chính">
    <ul>
      <li><a href="#">Trang chủ</a></li>
      <li>
        <a href="#">Sản phẩm</a>
        <ul>
          <li><a href="#">Máy tính</a></li>
          <li><a href="#">Điện thoại</a></li>
          <li><a href="#">Phụ kiện</a></li>
        </ul>
      </li>
      <li>
        <a href="#">Dịch vụ</a>
        <ul>
          <li><a href="#">Tư vấn</a></li>
          <li><a href="#">Bảo hành</a></li>
        </ul>
      </li>
      <li><a href="#">Liên hệ</a></li>
    </ul>
  </nav>
</body>
</html>
